# Cloud agent: label an issue `claude:implement` (or comment @claude on an issue/PR)
# and Claude works it on a branch and opens a PR. It never merges or deploys:
# the PR then goes through CI, review and the normal risk gate.
# Setup (once): run `claude setup-token` locally, then add the result as the
# repository secret CLAUDE_CODE_OAUTH_TOKEN (Settings -> Secrets and variables -> Actions).
name: Claude

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Only the repo owner can trigger it (public repo: strangers' comments must not run an agent).
    if: >-
      github.actor == github.repository_owner && (
        (github.event_name == 'issues' && github.event.label.name == 'claude:implement') ||
        (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "claude:implement"
          branch_prefix: "claude/"
          additional_permissions: |
            actions: read
